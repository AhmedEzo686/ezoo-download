[workspace]
resolver = "2"
members = ["crates/engine", "crates/app", "crates/host", "crates/android"]
# a plain `cargo build` is the Windows program; the Android library is
# built by android/build-rust.sh (cargo-ndk)
default-members = ["crates/engine", "crates/app", "crates/host"]

[workspace.package]
version = "1.0.13"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
