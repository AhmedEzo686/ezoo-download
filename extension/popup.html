<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ezoo Download</title>
  <link rel="stylesheet" href="apple-ui.css">
</head>
<body class="popup">
  <header class="popup-header">
    <div class="brand-mark" aria-hidden="true"><svg class="glyph" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg></div>
    <div><h1>Ezoo Download</h1><p>Browser companion</p></div>
    <button class="icon-button" id="settings" type="button" title="Extension Settings" aria-label="Extension Settings"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l.7 2.3 2 1.2L20 6l3 5-1.6 1.8v2.3L23 17l-3 5-2.3-.5-2 1.2L15 25H9l-.7-2.3-2-1.2L4 22l-3-5 1.6-1.9v-2.3L1 11l3-5 2.3.5 2-1.2Z" transform="translate(1 -1) scale(.84)"/><circle cx="11.1" cy="10.8" r="3"/></svg></button>
  </header>
  <main class="popup-content">
    <div class="group integration-row">
      <div class="integration-copy"><strong id="onText">Browser Integration</strong><small id="onHint">Send downloads to the app</small></div>
      <label class="switch-control" title="Browser Integration"><input type="checkbox" id="enabled" checked aria-label="Browser Integration"><span class="switch-track"></span></label>
    </div>
    <div class="section-heading"><h2>On This Page</h2><span class="item-count" id="mediaCount"></span></div>
    <div class="group media-list" id="media" aria-label="Available downloads">
      <div class="empty-state"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3Z"/></svg><strong>No Video Found Yet</strong><p>Start playing a video to see available formats.</p></div>
    </div>
    <details class="group widget-settings"><summary>Video Button <span>Appearance</span></summary><div class="scale-row"><input type="range" id="scale" min="50" max="200" step="5" value="100" aria-label="Video button size"><output id="scaleText" for="scale">100%</output><button class="text-button" id="scaleReset" type="button">Reset</button></div></details>
  </main>
  <footer class="popup-footer">
    <div class="footer-row"><span class="connection" id="status" role="status" aria-live="polite">Connecting…</span><a class="button-link" id="openApp" href="ezoo-download://open">Open App<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a></div>
    <p class="connection-hint" id="connectionHint" hidden>Open Ezoo Download to send downloads.</p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
