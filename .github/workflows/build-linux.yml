name: Build Ezoo Download for Linux

# Every push that touches the program: build the .deb and the portable
# folder, and keep them as an artifact (no release is published here).
on:
  push:
    paths:
      - "crates/**"
      - "packaging/linux/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "extension/**"
      - "extension-signed/**"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The libraries Slint and the program are built against
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config perl imagemagick \
            libfontconfig1-dev libfreetype-dev libexpat1-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libx11-dev libxcb1-dev libegl-dev libgl1-mesa-dev \
            libdbus-1-dev libssl-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the .deb and the portable folder
        run: ./packaging/linux/build-linux.sh

      - name: Check the package
        run: |
          dpkg-deb -I dist/ezoodownload_*.deb
          dpkg-deb -c dist/ezoodownload_*.deb | head -40

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ezoodownload-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
          retention-days: 14
