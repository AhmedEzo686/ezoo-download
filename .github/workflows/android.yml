name: Build Ezoo Download for Android

# The Android app (android/, crates/android): a test APK as an artifact of
# every push to the android branch.

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2 || cargo install cargo-ndk --locked
      - name: Engine (libezoo.so)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          android/build-rust.sh
      # the same test signature every build, so a new test APK installs over
      # the old one (made once by the build, kept in the cache)
      - name: Test signature
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.android/debug.keystore
          key: ezoo-android-debug-keystore
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.3"
      - name: APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Name
        id: name
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          N="EzooDownload-$V-android-test-$(git rev-parse --short HEAD).apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$N"
          echo "file=$N" >> "$GITHUB_OUTPUT"
          ls -la "$N"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EzooDownload-android-test
          path: ${{ steps.name.outputs.file }}
