name: Build Ezoo Download for Windows

# Every push: build and keep the result as an artifact.
# A push to main whose commit message contains [release] also publishes a
# GitHub release v<version> with the setup and version.json; installed
# copies of the program read version.json of the latest release
# (Help > Check for updates, or by themselves when they start).

on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Ezoo Download's own small ffmpeg (tools/ffmpeg/build.sh): built from the
  # official sources, both checked (exact commit / SHA-256), kept in the cache
  # until the script or a version changes
  ffmpeg:
    runs-on: ubuntu-24.04
    env:
      FFMPEG_TAG: n8.0.3
      FFMPEG_COMMIT: 8ae0b34901ba60a802f183ee75a250a9fc3e09a5
      LAME_URL: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
      LAME_SHA256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ env.FFMPEG_COMMIT }}-lame-${{ env.LAME_SHA256 }}-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 nasm pkg-config make
          git clone -q --depth 1 --branch "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg ffmpeg-src
          test "$(git -C ffmpeg-src rev-parse HEAD)" = "$FFMPEG_COMMIT" || { echo "::error::ffmpeg source is not the expected commit"; exit 1; }
          curl -sSfL -o lame.tar.gz "$LAME_URL"
          echo "$LAME_SHA256  lame.tar.gz" | sha256sum -c -
          tar xzf lame.tar.gz
          CC=x86_64-w64-mingw32-gcc bash tools/ffmpeg/build.sh ffmpeg-src lame-3.100 ffmpeg-out
          echo "$FFMPEG_TAG ($FFMPEG_COMMIT), LAME 3.100" > ffmpeg-out/ffmpeg-version.txt
      - name: Test files for our ffmpeg (made with the system's full ffmpeg)
        run: |
          sudo apt-get install -y -q ffmpeg >/dev/null
          mkdir -p ffmpeg-test && cd ffmpeg-test
          F="ffmpeg -hide_banner -loglevel error -y"
          V="-f lavfi -i testsrc2=size=320x180:rate=25:duration=4"; A="-f lavfi -i sine=frequency=500:duration=4:sample_rate=48000"
          $F $V -c:v libx264 -an -movflags +frag_keyframe+empty_moov -f mp4 v.mp4
          $F $A -c:a aac -vn -movflags +frag_keyframe+empty_moov -f mp4 a.m4a
          $F $V -c:v libvpx-vp9 -deadline realtime -an -f webm v.webm
          $F $A -c:a libopus -vn -f webm a.webm
          $F $V $A -c:v libx264 -c:a aac -f mpegts s.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg
          path: ffmpeg-out
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-test
          path: ffmpeg-test
          retention-days: 3

  windows:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      # actions pinned to exact commits (a moved tag can't change the build)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg
          path: ffmpeg-out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-test
          path: ffmpeg-test
      - name: Check our ffmpeg (everything Ezoo Download asks of it)
        shell: pwsh
        run: |
          $ff = "ffmpeg-out/ffmpeg.exe"; $t = "ffmpeg-test"
          function Run([string[]]$a, $out) {
            & $ff -hide_banner -loglevel error -y @a $out
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out) -or (Get-Item $out).Length -lt 1000) { throw "our ffmpeg failed: $($a -join ' ') $out" }
          }
          Run @("-i", "$t/v.mp4", "-i", "$t/a.m4a", "-map", "0:v:0", "-map", "1:a:0", "-c", "copy", "-movflags", "+faststart", "-f", "mp4") "$t/o1.mp4"
          Run @("-i", "$t/v.webm", "-i", "$t/a.webm", "-map", "0:v:0", "-map", "1:a:0", "-c", "copy", "-f", "webm") "$t/o2.webm"
          Run @("-i", "$t/a.webm", "-vn", "-map", "0:a:0", "-c:a", "libmp3lame", "-b:a", "192k", "-f", "mp3") "$t/o3.mp3"
          Run @("-f", "mpegts", "-i", "$t/s.ts", "-map", "0:v?", "-map", "0:a?", "-c", "copy", "-movflags", "+faststart", "-f", "mp4") "$t/o4.mp4"
          $n = (Get-Item "$t/v.mp4").Length / 2
          Run @("-protocol_whitelist", "file,subfile", "-i", "subfile,,start,0,end,$n,,:$((Resolve-Path "$t/v.mp4").Path)", "-c", "copy", "-f", "matroska") "$t/o5.mkv"
          Write-Host "our ffmpeg: $((Get-Item $ff).Length / 1MB) MB, all checks passed"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run extension tests
        run: |
          node extension/test/yt-core.test.js
          node extension/test/background.sim.js
      - name: Run engine tests
        shell: pwsh
        run: |
          cargo test -p swiftget-engine --no-fail-fast 2>&1 | Tee-Object -FilePath tests.txt
          $code = $LASTEXITCODE
          # failures (only real ones) show up as annotations on the run page;
          # case-sensitive, or every "0 failed" summary line looked like one
          if ($code -ne 0) {
            Select-String -CaseSensitive -Path tests.txt -Pattern "^error(\[|:)|panicked at|^test .* FAILED$|^---- " |
              Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            Write-Host "::warning::engine tests failed (exit $code)"
          }
          exit 0
      - name: Check dependencies for known vulnerabilities
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          # fails on published vulnerabilities; "unmaintained" notices only warn
          cargo audit
      - name: Build release
        run: cargo build --release
      - name: Package
        shell: pwsh
        env:
          # Mozilla add-on keys (addons.mozilla.org > Developer Hub > API keys);
          # with them the Firefox add-on is signed and stays in Firefox for good
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          # Ed25519 key that signs version.json; the program installs only
          # updates signed with it (selfupdate.rs has the public half)
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          IS_RELEASE: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') }}
        run: |
          $version = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($tag -ne $version) { throw "Tag v$tag does not match version $version in Cargo.toml" }
          }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV
          # everything for the setup is gathered here; the result is the setup only
          $p = "build-cache/stage"
          New-Item -ItemType Directory -Force "$p/tools", "dist" | Out-Null
          Copy-Item target/release/EzooDownload.exe $p
          Copy-Item THIRD-PARTY-NOTICES.txt $p
          Copy-Item -Recurse extension "$p/extension"
          Copy-Item -Recurse extension "$p/extension-firefox"
          Remove-Item -Recurse -Force "$p/extension/test", "$p/extension-firefox/test"
          Copy-Item -Force "$p/extension-firefox/manifest.firefox.json" "$p/extension-firefox/manifest.json"
          Remove-Item -Force "$p/extension-firefox/manifest.firefox.json", "$p/extension/manifest.firefox.json"
          # the add-on has its own version (manifest.firefox.json)
          $extVersion = (Get-Content extension/manifest.firefox.json -Raw | ConvertFrom-Json).version
          # Firefox keeps only add-ons signed by Mozilla; a version can be signed
          # once, so this runs for a release only
          if ($env:IS_RELEASE -eq "true" -and $env:AMO_JWT_ISSUER -and $env:AMO_JWT_SECRET -and -not (Test-Path "extension-signed/ezoo-download-firefox-$extVersion.xpi")) {
            npx --yes web-ext@8.10.0 sign --channel=unlisted --source-dir "$p/extension-firefox" --artifacts-dir xpi-out --api-key "$env:AMO_JWT_ISSUER" --api-secret "$env:AMO_JWT_SECRET" --approval-timeout 900000
            $xpi = Get-ChildItem xpi-out -Filter *.xpi | Select-Object -First 1
            if ($xpi) {
              Copy-Item $xpi.FullName "$p/ezoo-download-firefox.xpi"
              Copy-Item $xpi.FullName "dist/ezoo-download-firefox.xpi"
              $fx = "{`n  ""addons"": {`n    ""ezoo-download@ezoo-tech.com"": {`n      ""updates"": [`n        { ""version"": ""$extVersion"", ""update_link"": ""https://github.com/${{ github.repository }}/releases/download/v$version/ezoo-download-firefox.xpi"" }`n      ]`n    }`n  }`n}`n"
              [IO.File]::WriteAllText("$PWD/dist/firefox-updates.json", $fx)
            } else { Write-Host "::warning::the Firefox add-on was not signed" }
          } elseif ($env:IS_RELEASE -eq "true") { Write-Host "::warning::AMO_JWT_ISSUER / AMO_JWT_SECRET are not set: the Firefox add-on is not signed" }
          # an add-on of this version already signed (by hand on addons.mozilla.org)
          $signed = "extension-signed/ezoo-download-firefox-$extVersion.xpi"
          if (-not (Test-Path "$p/ezoo-download-firefox.xpi") -and (Test-Path $signed)) {
            Copy-Item $signed "$p/ezoo-download-firefox.xpi"
            Copy-Item $signed "dist/ezoo-download-firefox.xpi"
            $fx = "{`n  ""addons"": {`n    ""ezoo-download@ezoo-tech.com"": {`n      ""updates"": [`n        { ""version"": ""$extVersion"", ""update_link"": ""https://github.com/${{ github.repository }}/releases/download/v$version/ezoo-download-firefox.xpi"" }`n      ]`n    }`n  }`n}`n"
            [IO.File]::WriteAllText("$PWD/dist/firefox-updates.json", $fx)
          }
          # our own small ffmpeg (job "ffmpeg") and its licences
          Copy-Item ffmpeg-out/* "$p/tools/"
          # yt-dlp of one release, checked against that release's SHA2-256SUMS
          $yt = Invoke-RestMethod "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest" -Headers @{ "User-Agent" = "EzooDownload-ci"; "Authorization" = "Bearer ${{ github.token }}" }
          $ytExe = $yt.assets | Where-Object { $_.name -eq "yt-dlp.exe" } | Select-Object -First 1
          $ytSums = $yt.assets | Where-Object { $_.name -eq "SHA2-256SUMS" } | Select-Object -First 1
          if (-not $ytExe -or -not $ytSums) { throw "the yt-dlp release has no yt-dlp.exe / SHA2-256SUMS" }
          Invoke-WebRequest $ytExe.browser_download_url -OutFile "$p/tools/yt-dlp.exe"
          $ySumText = (Invoke-WebRequest $ytSums.browser_download_url).Content
          if ($ySumText -is [byte[]]) { $ySumText = [Text.Encoding]::UTF8.GetString($ySumText) }
          $yWant = ($ySumText -split "`n" | Where-Object { $_ -match "^([0-9a-fA-F]{64})\s+\*?yt-dlp\.exe\s*$" } | ForEach-Object { ($_ -split '\s+')[0] } | Select-Object -First 1)
          $yGot = (Get-FileHash "$p/tools/yt-dlp.exe" -Algorithm SHA256).Hash
          if (-not $yWant -or $yGot -ne $yWant.ToUpper()) { throw "yt-dlp.exe does not match its published SHA-256" }
          # aria2 (torrents): one fixed build, checked against its known SHA-256
          Invoke-WebRequest "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile aria2.zip
          if ((Get-FileHash aria2.zip -Algorithm SHA256).Hash -ne "67D015301EEF0B612191212D564C5BB0A14B5B9C4796B76454276A4D28D9B288") { throw "aria2.zip does not match its SHA-256" }
          Expand-Archive aria2.zip -DestinationPath aria2-tmp
          $a2 = Get-ChildItem aria2-tmp -Recurse -Filter aria2c.exe | Select-Object -First 1
          if ((Get-FileHash $a2.FullName -Algorithm SHA256).Hash -ne "BE2099C214F63A3CB4954B09A0BECD6E2E34660B886D4C898D260FEBFE9D70C2") { throw "aria2c.exe does not match its SHA-256" }
          Copy-Item $a2.FullName "$p/tools/"
          Copy-Item (Get-ChildItem aria2-tmp -Recurse -Filter COPYING | Select-Object -First 1).FullName "$p/tools/aria2-COPYING.txt"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DMyAppVersion=$version" installer\ezoo.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $hash = (Get-FileHash dist/EzooDownload-Setup.exe -Algorithm SHA256).Hash.ToLower()
          # the signature the program checks before it installs an update
          $sig = ""
          if ($env:UPDATE_SIGNING_KEY) {
            $sig = (cargo run --quiet --release -p swiftget-engine --example sign_update -- $version $hash).Trim()
            if ($LASTEXITCODE -ne 0 -or $sig.Length -ne 128) { throw "could not sign the release" }
          } elseif ($env:IS_RELEASE -eq "true") {
            throw "UPDATE_SIGNING_KEY is not set: installed copies would refuse this update"
          }
          $json = "{`n  ""version"": ""$version"",`n  ""url"": ""https://github.com/${{ github.repository }}/releases/download/v$version/EzooDownload-Setup.exe"",`n  ""sha256"": ""$hash"",`n  ""sig"": ""$sig""`n}`n"
          [IO.File]::WriteAllText("$PWD/dist/version.json", $json)
          Get-Content dist/version.json
          Compress-Archive -Path dist/EzooDownload-Setup.exe, dist/version.json -DestinationPath EzooDownload-windows.zip -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EzooDownload-windows
          path: EzooDownload-windows.zip
      # a release is published only when the commit message says [release]
      # (tag v<version> is created here); the same version again is skipped
      - name: Publish release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$env:VERSION is already released"; exit 0 }
          $files = @("dist/EzooDownload-Setup.exe", "dist/version.json")
          if (Test-Path dist/ezoo-download-firefox.xpi) { $files += "dist/ezoo-download-firefox.xpi", "dist/firefox-updates.json" }
          gh release create "v$env:VERSION" @files --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Ezoo Download $env:VERSION" --notes "Ezoo Download $env:VERSION" --latest
          if ($LASTEXITCODE -ne 0) { throw "could not create the release" }
          # only the newest release stays: older ones (and their tags) go
          $tags = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName'
          foreach ($t in $tags) {
            if ($t -and $t -ne "v$env:VERSION") {
              Write-Host "Removing old release $t"
              gh release delete $t --repo "${{ github.repository }}" --yes --cleanup-tag
            }
          }
