[package]
name = "ezoo-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ezoo Download for Android: the download engine, called from the app (JNI)"
publish = false

[lib]
name = "ezoo"
crate-type = ["cdylib"]

[dependencies]
swiftget-engine = { path = "../engine" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
jni = { version = "0.21", default-features = false }
# the browser's ad blocking: Brave's engine for the filter lists people use
# (EasyList, uBlock Origin's lists...): requests, hiding and page fixes.
# Not single-thread: the browser asks from many threads at once
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { workspace = true }
