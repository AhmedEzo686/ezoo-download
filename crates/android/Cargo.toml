[package]
name = "ezoo-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ezoo Download for Android: the download engine, called from the app (JNI)"
publish = false

[lib]
name = "ezoo"
crate-type = ["cdylib"]

[dependencies]
swiftget-engine = { path = "../engine" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
jni = { version = "0.21", default-features = false }
