[package]
name = "swiftget-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Download engine: multi-connection segmented downloads, resume, HLS, queue and scheduler"

[dependencies]
# a small send buffer towards ffmpeg (clipserve): it reads only what it needs
socket2 = "0.6"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7"
# default features = native TLS (SChannel on Windows), HTTP/2, charset, system proxy
# native-tls-alpn: the connection says which protocol it speaks (ALPN), as
# browsers do. Without it Cloudflare's protection refuses the program
# (HTTP 403, "challenge") however the request itself looks
reqwest = { version = "0.12", features = ["native-tls-alpn"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
url = "2"
percent-encoding = "2"
aes = "0.8"
cbc = "0.1"
regex = "1"
filetime = "0.2"
sha2 = "0.10"
# Ed25519 check of signed updates (selfupdate.rs)
ring = "0.17"
# torrents (bt.rs), inside the program. Its own TLS is left out: the HTTP
# trackers use the system's (SChannel on Windows) and SHA-1 comes from the
# system too, so building needs nothing more than Rust
librqbit = { version = "9.1", default-features = false }
librqbit-core = { version = "9.1", default-features = false, features = ["sha1-crypto-hash"] }
librqbit-sha1-wrapper = { version = "9.1", default-features = false, features = ["sha1-crypto-hash"] }
reqwest-bt = { package = "reqwest", version = "0.13", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }
native-tls = "0.2"
tokio-native-tls = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
