[package]
name = "swiftget-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Download engine: multi-connection segmented downloads, resume, HLS, queue and scheduler"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7"
# default features = native TLS (SChannel on Windows), HTTP/2, charset, system proxy
reqwest = { version = "0.12" }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
url = "2"
percent-encoding = "2"
aes = "0.8"
cbc = "0.1"
regex = "1"
filetime = "0.2"
sha2 = "0.10"
# Ed25519 check of signed updates (selfupdate.rs)
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
