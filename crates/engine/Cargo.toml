[package]
name = "swiftget-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Download engine: multi-connection segmented downloads, resume, HLS, queue and scheduler"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7"
# TLS is per-OS: Windows keeps the system store (SChannel) like before, other
# systems use rustls with the native certificate store, so no OpenSSL headers
# are needed to build and the binary carries its own TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
url = "2"
percent-encoding = "2"
aes = "0.8"
cbc = "0.1"
regex = "1"
filetime = "0.2"
sha2 = "0.10"
# Ed25519 check of signed updates (selfupdate.rs)
ring = "0.17"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_Security_Cryptography",
] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
