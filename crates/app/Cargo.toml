[package]
name = "swiftget"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ezoo Download – download manager (desktop app)"
build = "build.rs"

[dependencies]
swiftget-engine = { path = "../engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# ~1.18: the winit accessor (unstable-winit-030) belongs to this Slint line
# renderer-software: a CPU fallback so the app also runs where OpenGL is missing
slint = { version = "~1.18", features = ["raw-window-handle-06", "unstable-winit-030", "renderer-software"] }
tiny_http = "0.12"
arboard = { version = "3", default-features = false }
# Linux: the GTK file-dialog backend needs GTK headers at build time; the
# xdg-desktop-portal backend is pure Rust and works on GNOME / KDE / XFCE alike
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
open = "5"
url = "2"
chrono = "0.4"
sha2 = "0.10"
tokio-util = "0.7"
sys-locale = "0.3"

[build-dependencies]
slint-build = "~1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "EzooDownload"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem tray (the "next to the clock" icon of KDE, GNOME and XFCE):
# pure Rust DBus client, no GTK main loop, so it lives beside the Slint loop.
# (async-io, not tokio: the Slint crate itself also pulls in ksni)
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
] }
