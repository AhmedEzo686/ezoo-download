[package]
name = "swiftget"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ezoo Download – download manager (desktop app)"
build = "build.rs"

# The renderer set is per-OS: Windows keeps the defaults (femtovg OpenGL),
# Linux gets OpenGL plus the pure-CPU software renderer as a fallback.
[dependencies]
swiftget-engine = { path = "../engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# ~1.18: the winit accessor (unstable-winit-030) belongs to this Slint line
slint = { version = "~1.18", default-features = false, features = [
    "std",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
tiny_http = "0.12"
arboard = { version = "3", default-features = false }
rfd = "0.15"
open = "5"
url = "2"
chrono = "0.4"
sha2 = "0.10"
tokio-util = "0.7"
sys-locale = "0.3"

[build-dependencies]
slint-build = "~1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "EzooDownload"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
slint = { version = "~1.18", features = ["backend-winit", "renderer-femtovg"] }
tray-icon = "0.19"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
] }

# Linux: the tray icon talks D-Bus StatusNotifierItem (ksni) directly, so it
# works on KDE, GNOME (with the AppIndicator extension) and XFCE without any
# GTK development files; the software renderer is built in as a fallback for
# machines without working OpenGL.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "~1.18", features = ["backend-winit", "renderer-femtovg", "renderer-software"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
libc = "0.2"
